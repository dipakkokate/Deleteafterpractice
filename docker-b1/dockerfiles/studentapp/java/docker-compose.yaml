services:
  tomcat:
    build: .
    container_name: studentapp
    ports:
      - "8080:8080"
    depends_on:
      - db

  db:
    image: mysql:5.7
    container_name: studentdb
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: studentapp
      MYSQL_USER: student
      MYSQL_PASSWORD: student@1
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
